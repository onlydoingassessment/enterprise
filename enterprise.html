<!DOCTYPE html>
<html>
<head>
    <title>GonkRewards - Enterprise</title>
  <link rel="stylesheet" href="enterprise.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Inconsolata:wght@200..900&family=Sixtyfour&display=swap" rel="stylesheet">
  <!-- Chart.js CDN for visual rendering capabilities -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="enterprise.js"></script>
</head>
<body class="bigback">
    <div class="absolutewawawa">
        <button class="navitem" onclick="window.open('./redemptions.html', '_self')">Redemptions</button>
        <button class="navitem" onclick="window.open('./enterprise.html', '_self')">Dashboard</button>
        <button class="navitem" onclick="window.open('./enterprise-rewards.html', '_self')">Manage Rewards</button>
        <button class="navitem" onclick="window.open('./login.html', '_self')">Logout</button>
    </div>
    <!--Gonk-->
    <div class="mediumbreak"></div>
    <div class="fixed nfront ripplespace">
        <h3 class="othertitle medium" id="welcome" style="padding-bottom:0px;">Welcome, enterprise_name</h3>
        <h5 class="othertitle medium-smallish" id="entid" style="padding-top:0px;">Enterprise ID: </h5>
        <p class="center medium-small">Manage your rewards at the "Manage Rewards" tab or view your data here at the dashboard.</p>
    </div>
    <br>
    <div class="fixed nfront ripplespace">
        <h3 class="othertitle medium">Data</h3>
        
        <!-- Interactive configuration nodes to swap between different rewards -->
        <div style="margin: auto; margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
            <label for="productSelect" style="font-weight: bold;">Select Product to Track:</label>
            <select id="productSelect" style="color: white; padding: 6px; border-radius: 4px; border: 1px solid #ae00ff; background: rgb(117, 0, 184);">
                <option value="">-- Select a Product --</option>
            </select>
        </div>

        <!-- Chart layout wrapper -->
        <div class="chart-container" style="position: relative; height: 320px; width: 100%;">
            <canvas id="redemptionChart"></canvas>
        </div>
    </div>
    <div class="bigbreak"></div>
</body>
</html>
